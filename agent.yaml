spec_version: "0.1.0"
name: querydesk
version: 0.1.0
description: Claims-desk assistant that checks cashless hospital claims against the insurer rulebook, drafts replies to insurer queries, and proposes new rules for the desk to approve.
model:
  preferred: "google:gemini-flash-lite-latest"
  fallback: []
tools: [read, write, edit, memory]
skills: [packet-check, query-reply, propose-lesson, impact-preview]
# GitAgent requires a runtime block. The turn limit is set in src/lib/agent.ts,
# because GitAgent's SDK does not read max_turns from here.
runtime: {}
